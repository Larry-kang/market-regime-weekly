name: generate-weekly

on:
  schedule:
    - cron: '5 1 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-public-reports
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache market history
        uses: actions/cache@v4
        with:
          path: data/market_history
          key: market-history-v1-${{ runner.os }}-${{ hashFiles('data/market_history/*.csv.gz') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Generate weekly reports
        run: python scripts/generate_site.py --mode weekly

      - name: Validate generated site
        run: python scripts/validate_generated_site.py "$(TZ=Asia/Taipei date +%F)" . weekly

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_history docs README.md
          git commit -m "chore: generate weekly market reports"
          git push
