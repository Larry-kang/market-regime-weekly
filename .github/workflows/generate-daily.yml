name: generate-daily

on:
  schedule:
    # 14:05 Taiwan time on weekdays; after the Taiwan cash market close.
    - cron: '5 6 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-public-reports
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Generate daily reports
        run: python scripts/generate_site.py --mode daily

      - name: Validate generated site
        run: python scripts/validate_generated_site.py "$(TZ=Asia/Taipei date +%F)" . daily

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs README.md
          git commit -m "chore: generate daily market reports"
          git push
