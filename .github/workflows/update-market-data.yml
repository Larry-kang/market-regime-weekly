name: update-market-data

on:
  schedule:
    # 13:30 Taiwan time on weekdays; before the 14:05 daily report.
    - cron: '30 5 * * 1-5'
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: 'Discard existing history and download full history'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cache market history
        uses: actions/cache@v4
        with:
          path: data/market_history
          key: market-history-v1-${{ runner.os }}-${{ hashFiles('data/market_history/*.csv.gz') }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"

      - name: Update market history
        env:
          FULL_REBUILD: ${{ inputs.full_rebuild || 'false' }}
        run: |
          if [ "$FULL_REBUILD" = "true" ]; then
            python scripts/update_market_data.py --full-rebuild
          else
            python scripts/update_market_data.py
          fi

      - name: Commit updated market history
        run: |
          if git diff --quiet -- data/market_history; then
            echo "No market history changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/market_history
          git commit -m "chore: update market price data"
          git push
